services:
  db:
    image: postgres:16
    container_name: solar_forecast_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port 5433 avoids clashing with a PostgreSQL already installed on the
      # host (Homebrew postgresql@14 owns 5432 on this machine).
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
